# fly.toml app configuration file generated for montie on 2026-10-02T20:34:21-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'montie'
primary_region = 'ord'
kill_signal = 'SIGTERM'

[build]
[env]
  DATABASE_PATH = '/db/monty.db'
  PHX_HOST = 'montie.fly.dev'
  PORT = '8080'

[[mounts]]
  source = 'db'
  destination = '/db'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
